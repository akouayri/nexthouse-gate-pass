<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building Gate Access Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, child, onValue, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        window.FirebaseSDK = { initializeApp, getDatabase, ref, set, get, child, onValue, push };
    </script>
</head>
<body class="h-full bg-slate-950 text-slate-100 font-sans antialiased flex flex-col justify-between">

    <!-- Top Navigation / Role Banner -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <div class="bg-emerald-500 text-slate-950 font-bold px-3 py-1.5 rounded-lg text-sm tracking-wider">SECUREPASS</div>
            <h1 id="portal-title" class="text-lg font-semibold text-slate-200">Building Access Portal</h1>
        </div>
        <div id="nav-actions" class="flex space-x-2 text-sm">
            <a href="?" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-md transition">Portal Home</a>
        </div>
    </header>

    <!-- Main Dynamic Content Container -->
    <main class="flex-grow container mx-auto px-4 py-8 max-w-4xl">
        <div id="app-container">
            <!-- Dynamically rendered view goes here -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 text-center py-4 text-xs text-slate-400">
        Secure Gate Pass & Verification System &bull; Enterprise Access Control
    </footer>

    <!-- App Logic Script -->
    <script type="module">
        // Helper to get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const currentView = urlParams.get('view') || 'home';
        const passIdParam = urlParams.get('passId');

        // Local storage or Firebase fallback helpers
        const getFirebaseConfig = () => {
            const saved = localStorage.getItem('firebase_config');
            return saved ? JSON.parse(saved) : null;
        };

        let db = null;
        const config = getFirebaseConfig();
        if (config && window.FirebaseSDK) {
            try {
                const app = window.FirebaseSDK.initializeApp(config);
                db = window.FirebaseSDK.getDatabase(app);
            } catch (e) {
                console.error("Firebase init error:", e);
            }
        }

        const container = document.getElementById('app-container');
        const titleEl = document.getElementById('portal-title');

        // --- ROUTER & VIEW RENDERER ---
        if (currentView === 'host') {
            titleEl.textContent = 'Host Portal - Airbnb Integration';
            renderHostView(container);
        } else if (currentView === 'guest') {
            titleEl.textContent = 'Guest Pre-Registration Pass';
            renderGuestView(container, urlParams.get('unit') || '101');
        } else if (currentView === 'security') {
            titleEl.textContent = 'Security Guard Gate Verification';
            renderSecurityView(container, passIdParam);
        } else {
            titleEl.textContent = 'Gate Access Portal Gateway';
            renderHomeView(container);
        }

        // 1. HOME / GATEWAY VIEW (Select Role)
        function renderHomeView(parent) {
            const currentBaseUrl = window.location.href.split('?')[0];
            parent.innerHTML = `
                <div class="space-y-6 text-center max-w-2xl mx-auto py-12">
                    <h2 class="text-3xl font-bold tracking-tight text-white">Select Your Access Role</h2>
                    <p class="text-slate-400">Choose the appropriate portal view. Each view is strictly isolated for security.</p>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 pt-6">
                        <a href="?view=host" class="p-6 bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-emerald-500 rounded-xl transition flex flex-col items-center space-y-3 group">
                            <div class="p-3 bg-emerald-500/10 text-emerald-400 rounded-lg group-hover:scale-110 transition">
                                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                            </div>
                            <h3 class="font-semibold text-lg">Host Portal</h3>
                            <p class="text-xs text-slate-400">Generate guest pre-registration links for Airbnb messaging.</p>
                        </a>

                        <a href="?view=guest" class="p-6 bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-blue-500 rounded-xl transition flex flex-col items-center space-y-3 group">
                            <div class="p-3 bg-blue-500/10 text-blue-400 rounded-lg group-hover:scale-110 transition">
                                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                            </div>
                            <h3 class="font-semibold text-lg">Guest Registration</h3>
                            <p class="text-xs text-slate-400">Register arrival details and obtain your digital gate pass QR code.</p>
                        </a>

                        <a href="?view=security" class="p-6 bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-amber-500 rounded-xl transition flex flex-col items-center space-y-3 group">
                            <div class="p-3 bg-amber-500/10 text-amber-400 rounded-lg group-hover:scale-110 transition">
                                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                            </div>
                            <h3 class="font-semibold text-lg">Security Guard Desk</h3>
                            <p class="text-xs text-slate-400">Verify guest passes and approve building entry at the gate.</p>
                        </a>
                    </div>

                    <div class="pt-8 border-t border-slate-800">
                        <details class="text-left bg-slate-900 p-4 rounded-xl border border-slate-800">
                            <summary class="cursor-pointer font-medium text-sm text-slate-300">⚙️ Optional: Configure Cloud Database (Firebase)</summary>
                            <div class="mt-4 space-y-3 text-xs">
                                <p class="text-slate-400">Paste your Firebase configuration JSON or keys here to sync data live across guest phones and guard tablets.</p>
                                <textarea id="fb-config-input" class="w-full h-24 bg-slate-950 p-3 rounded border border-slate-800 font-mono text-slate-300" placeholder='{"apiKey": "...", "databaseURL": "...", "projectId": "..."}'></textarea>
                                <button id="save-fb-btn" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded">Save Firebase Config</button>
                            </div>
                        </details>
                    </div>
                </div>
            `;

            const savedCfg = localStorage.getItem('firebase_config');
            if (savedCfg) document.getElementById('fb-config-input').value = savedCfg;

            document.getElementById('save-fb-btn').addEventListener('click', () => {
                try {
                    const val = document.getElementById('fb-config-input').value.trim();
                    JSON.parse(val);
                    localStorage.setItem('firebase_config', val);
                    alert('Firebase configuration saved successfully! Reloading...');
                    window.location.reload();
                } catch (err) {
                    alert('Invalid JSON format. Please check your Firebase config object.');
                }
            });
        }

        // 2. HOST VIEW
        function renderHostView(parent) {
            const baseUrl = window.location.href.split('?')[0];
            parent.innerHTML = `
                <div class="space-y-6 max-w-xl mx-auto bg-slate-900 p-6 rounded-2xl border border-slate-800">
                    <h2 class="text-xl font-bold text-white">Airbnb Host Messaging Link Generator</h2>
                    <p class="text-xs text-slate-400">Configure your apartment details below to generate a unique pre-registration link for your automated Airbnb messages.</p>

                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">Building Name / Property</label>
                            <input type="text" id="host-building" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm" value="Grand Tower Residences">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">Apartment / Unit Number</label>
                            <input type="text" id="host-unit" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm" value="Unit 402">
                        </div>

                        <button id="generate-link-btn" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-lg transition text-sm">Generate Airbnb Message Template</button>
                    </div>

                    <div id="output-box" class="hidden space-y-3 pt-4 border-t border-slate-800">
                        <label class="block text-xs font-medium text-emerald-400">Copy & Paste into Airbnb Scheduled Messages:</label>
                        <textarea id="airbnb-template" readonly class="w-full h-32 bg-slate-950 p-3 rounded border border-slate-800 text-xs font-mono text-slate-300 select-all"></textarea>
                        <button id="copy-template-btn" class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs rounded font-medium">Copy to Clipboard</button>
                    </div>
                </div>
            `;

            document.getElementById('generate-link-btn').addEventListener('click', () => {
                const building = document.getElementById('host-building').value;
                const unit = document.getElementById('host-unit').value;
                const guestLink = `${baseUrl}?view=guest&unit=${encodeURIComponent(unit)}&building=${encodeURIComponent(building)}`;

                const template = `Hi! Welcome to ${building}. Before your arrival, please register your details and vehicle info for building security gate clearance using this link: \n\n${guestLink}\n\nOnce completed, you will receive your digital gate pass QR code.`;

                document.getElementById('airbnb-template').value = template;
                document.getElementById('output-box').classList.remove('hidden');
            });

            document.getElementById('copy-template-btn').addEventListener('click', () => {
                const text = document.getElementById('airbnb-template');
                text.select();
                navigator.clipboard.writeText(text.value);
                alert('Airbnb message template copied to clipboard!');
            });
        }

        // 3. GUEST REGISTRATION VIEW
        function renderGuestView(parent, defaultUnit) {
            const unit = urlParams.get('unit') || defaultUnit;
            const building = urlParams.get('building') || 'Grand Tower Residences';

            parent.innerHTML = `
                <div class="max-w-xl mx-auto bg-slate-900 p-6 rounded-2xl border border-slate-800">
                    <div id="form-wrapper">
                        <h2 class="text-xl font-bold text-white mb-1">Guest Gate Pre-Registration</h2>
                        <p class="text-xs text-slate-400 mb-6">Property: <span class="text-emerald-400 font-medium">${building} (${unit})</span></p>

                        <form id="guest-form" class="space-y-4">
                            <div>
                                <label class="block text-xs font-medium text-slate-300 mb-1">Full Legal Name</label>
                                <input type="text" id="g-name" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm" placeholder="John Doe">
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-medium text-slate-300 mb-1">Check-in Date</label>
                                    <input type="date" id="g-checkin" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-slate-300 mb-1">Check-out Date</label>
                                    <input type="date" id="g-checkout" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-300 mb-1">Vehicle License Plate (Optional)</label>
                                <input type="text" id="g-vehicle" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm" placeholder="7ABC123">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-300 mb-1">Mobile Phone Number</label>
                                <input type="tel" id="g-phone" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm" placeholder="+1 (555) 000-0000">
                            </div>

                            <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-lg transition text-sm">Submit & Generate Gate Pass</button>
                        </form>
                    </div>

                    <div id="pass-wrapper" class="hidden text-center space-y-6">
                        <div class="p-4 bg-emerald-950/40 border border-emerald-500/30 rounded-xl">
                            <span class="text-emerald-400 font-bold text-sm">Registration Confirmed!</span>
                            <p class="text-xs text-slate-300 mt-1">Show this QR code at the building security gate upon arrival.</p>
                        </div>

                        <div class="bg-white text-slate-950 p-6 rounded-2xl max-w-xs mx-auto space-y-4 shadow-xl">
                            <div class="text-left border-b pb-3">
                                <span class="text-[10px] font-bold tracking-widest uppercase text-slate-500">Digital Access Pass</span>
                                <h3 id="pass-guest-name" class="font-bold text-lg text-slate-900"></h3>
                                <p class="text-xs text-slate-600">Unit: <span id="pass-unit"></span> | Building: <span id="pass-building"></span></p>
                            </div>
                            
                            <!-- QR Code Container -->
                            <div id="qrcode-container" class="flex justify-center bg-white p-2"></div>
                            
                            <div class="text-[10px] text-slate-500 font-mono">
                                Pass ID: <span id="pass-id-text"></span>
                            </div>
                        </div>

                        <p class="text-xs text-slate-400">Tip: Take a screenshot or scan this with your phone camera when arriving at security.</p>
                    </div>
                </div>
            `;

            document.getElementById('guest-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const passId = 'PASS-' + Math.random().toString(36).substring(2, 8).toUpperCase();
                const record = {
                    id: passId,
                    name: document.getElementById('g-name').value,
                    checkin: document.getElementById('g-checkin').value,
                    checkout: document.getElementById('g-checkout').value,
                    vehicle: document.getElementById('g-vehicle').value || 'None',
                    phone: document.getElementById('g-phone').value,
                    unit: unit,
                    building: building,
                    timestamp: Date.now()
                };

                // Save to Firebase if available, otherwise localStorage
                if (db && window.FirebaseSDK) {
                    await window.FirebaseSDK.set(window.FirebaseSDK.ref(db, 'passes/' + passId), record);
                } else {
                    let localPasses = JSON.parse(localStorage.getItem('local_passes') || '{}');
                    localPasses[passId] = record;
                    localStorage.setItem('local_passes', JSON.stringify(localPasses));
                }

                // Render Pass View
                document.getElementById('form-wrapper').classList.add('hidden');
                document.getElementById('pass-wrapper').classList.remove('hidden');
                document.getElementById('pass-guest-name').textContent = record.name;
                document.getElementById('pass-unit').textContent = record.unit;
                document.getElementById('pass-building').textContent = record.building;
                document.getElementById('pass-id-text').textContent = passId;

                // Generate QR code encoding the direct SECURITY URL so native phone camera opens it instantly!
                const securityUrl = `${window.location.href.split('?')[0]}?view=security&passId=${passId}`;
                document.getElementById('qrcode-container').innerHTML = '';
                new QRCode(document.getElementById('qrcode-container'), {
                    text: securityUrl,
                    width: 180,
                    height: 180,
                    colorDark: "#0f172a",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
            });
        }

        // 4. SECURITY GUARD VIEW
        function renderSecurityView(parent, passIdParam) {
            parent.innerHTML = `
                <div class="max-w-xl mx-auto space-y-6">
                    <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
                        <h2 class="text-xl font-bold text-white">Security Gate Verification Desk</h2>
                        <p class="text-xs text-slate-400">Scan guest QR codes with your phone's regular camera app, or enter the Pass ID manually below.</p>

                        <div class="flex space-x-2">
                            <input type="text" id="search-pass-id" class="flex-grow bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm uppercase font-mono" placeholder="Enter Pass ID (e.g. PASS-XYZ)">
                            <button id="verify-btn" class="px-5 py-2.5 bg-amber-600 hover:bg-amber-500 text-white font-semibold rounded-lg text-sm transition">Verify Pass</button>
                        </div>
                    </div>

                    <!-- Verification Result Card -->
                    <div id="verification-result" class="hidden bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
                        <div id="status-badge" class="p-3 rounded-xl text-center font-bold text-sm"></div>
                        
                        <div class="grid grid-cols-2 gap-4 text-xs bg-slate-950 p-4 rounded-xl border border-slate-800">
                            <div><span class="text-slate-500 block">Guest Name</span><strong id="res-name" class="text-sm text-white"></strong></div>
                            <div><span class="text-slate-500 block">Unit Destination</span><strong id="res-unit" class="text-sm text-emerald-400"></strong></div>
                            <div><span class="text-slate-500 block">Stay Duration</span><span id="res-dates" class="text-slate-300"></span></div>
                            <div><span class="text-slate-500 block">Vehicle Plate</span><strong id="res-vehicle" class="text-sm text-amber-400"></strong></div>
                        </div>

                        <button id="log-entry-btn" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-lg text-sm transition">Confirm Entry & Log Timestamp</button>
                    </div>
                </div>
            `;

            async function performVerification(id) {
                if (!id) return;
                let record = null;

                if (db && window.FirebaseSDK) {
                    const snapshot = await window.FirebaseSDK.get(window.FirebaseSDK.child(window.FirebaseSDK.ref(db), `passes/${id}`));
                    if (snapshot.exists()) record = snapshot.val();
                } else {
                    const localPasses = JSON.parse(localStorage.getItem('local_passes') || '{}');
                    record = localPasses[id];
                }

                const resultBox = document.getElementById('verification-result');
                const badge = document.getElementById('status-badge');
                resultBox.classList.remove('hidden');

                if (record) {
                    badge.className = "p-3 rounded-xl text-center font-bold text-sm bg-emerald-950 text-emerald-400 border border-emerald-500/30";
                    badge.textContent = "APPROVED — VALID PASS";
                    document.getElementById('res-name').textContent = record.name;
                    document.getElementById('res-unit').textContent = record.unit + ' (' + record.building + ')';
                    document.getElementById('res-dates').textContent = record.checkin + ' to ' + record.checkout;
                    document.getElementById('res-vehicle').textContent = record.vehicle;
                } else {
                    badge.className = "p-3 rounded-xl text-center font-bold text-sm bg-rose-950 text-rose-400 border border-rose-500/30";
                    badge.textContent = "INVALID OR EXPIRED PASS";
                    document.getElementById('res-name').textContent = "Unknown";
                    document.getElementById('res-unit').textContent = "---";
                    document.getElementById('res-dates').textContent = "---";
                    document.getElementById('res-vehicle').textContent = "---";
                }
            }

            document.getElementById('verify-btn').addEventListener('click', () => {
                const id = document.getElementById('search-pass-id').value.trim();
                performVerification(id);
            });

            document.getElementById('log-entry-btn').addEventListener('click', () => {
                alert('Entry successfully recorded in building security audit log.');
                window.location.href = window.location.href.split('?')[0] + '?view=security';
            });

            // If scanned via phone native camera with passId in query string, verify automatically!
            if (passIdParam) {
                document.getElementById('search-pass-id').value = passIdParam;
                performVerification(passIdParam);
            }
        }
    </script>
</body>
</html>
